name: Local-equivalent validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify checkout bytes before tests
        run: node scripts/check-checkout.cjs
      - run: node scripts/test.mjs
      - run: node tests/engine/run.cjs
      - name: Known regressions must pass (currently blocked)
        run: node tests/known-regressions/tools/known_gate.cjs
