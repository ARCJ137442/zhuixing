name: Local-equivalent validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test.mjs
      - run: node tests/engine/run.cjs
      - name: Known regressions must pass (currently blocked)
        run: node tests/known-regressions/tools/known_gate.cjs
